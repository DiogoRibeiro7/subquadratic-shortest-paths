# GitHub Actions CI/CD workflow for libsssp
# Builds and tests across multiple platforms and compilers

name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # Linux builds
  # ============================================================================
  linux:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]
        compiler: [gcc, clang]
        include:
          - os: ubuntu-20.04
            compiler: gcc
            cc: gcc-9
            cxx: g++-9
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - os: ubuntu-20.04
            compiler: clang
            cc: clang-10
            cxx: clang++-10
          - os: ubuntu-22.04
            compiler: clang
            cc: clang-14
            cxx: clang++-14

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          valgrind \
          doxygen \
          graphviz

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DSSSP_BUILD_SHARED=ON \
          -DSSSP_BUILD_STATIC=ON \
          -DSSSP_BUILD_TESTS=ON \
          -DSSSP_BUILD_EXAMPLES=ON \
          -DSSSP_ENABLE_LTO=ON

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --parallel $(nproc)

    - name: Install
      run: sudo cmake --install build --prefix /tmp/libsssp-install

    - name: Verify installation
      run: |
        test -f /tmp/libsssp-install/include/sssp.h
        test -f /tmp/libsssp-install/lib/libsssp.so || test -f /tmp/libsssp-install/lib/libsssp.a
        pkg-config --modversion libsssp || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: libsssp-${{ matrix.os }}-${{ matrix.compiler }}
        path: build/bin/*

  # ============================================================================
  # Sanitizer builds
  # ============================================================================
  sanitizers:
    name: Sanitizers - ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
        include:
          - sanitizer: asan
            cmake_flag: SSSP_ENABLE_ASAN
          - sanitizer: ubsan
            cmake_flag: SSSP_ENABLE_UBSAN
          - sanitizer: tsan
            cmake_flag: SSSP_ENABLE_TSAN

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang

    - name: Configure CMake
      env:
        CC: clang-14
        CXX: clang++-14
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -D${{ matrix.cmake_flag }}=ON \
          -DSSSP_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure

  # ============================================================================
  # Package generation
  # ============================================================================
  package:
    name: Create packages
    needs: [linux]
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Install packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build rpm

    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        cmake --build build --parallel

    - name: Create source package
      working-directory: ${{ github.workspace }}/build
      run: cpack -G TGZ --config CPackSourceConfig.cmake

    - name: Create DEB package
      working-directory: ${{ github.workspace }}/build
      run: cpack -G DEB

    - name: Create RPM package
      working-directory: ${{ github.workspace }}/build
      run: cpack -G RPM

    - name: Upload packages
      uses: actions/upload-artifact@v3
      with:
        name: packages
        path: |
          build/*.tar.gz
          build/*.deb
          build/*.rpm

  # ============================================================================
  # Conan package test
  # ============================================================================
  conan:
    name: Conan package test
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: pip install conan

    - name: Create Conan package
      run: conan create . --build=missing

    - name: Test Conan package
      run: conan test test_package libsssp/1.0.0@
